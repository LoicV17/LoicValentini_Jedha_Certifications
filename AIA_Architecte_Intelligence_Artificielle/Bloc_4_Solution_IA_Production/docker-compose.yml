version: '3.8'

name: NMM-Lakers-Edition

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.0
  environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    - AIRFLOW__WEBSERVER__RBAC=True
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  volumes:
    - nmm_airflow_home:/opt/airflow        # volume commun
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:13
    container_name: nmm_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - nmm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: nmm_airflow_init
    command: bash -c "airflow db init && airflow users create --username admin --firstname Loic --lastname Valentini --role Admin --email loic@example.com --password admin"
    depends_on:
      - postgres

  airflow-webserver:
    <<: *airflow-common
    container_name: nmm_airflow_webserver
    command: bash -c "airflow db upgrade && exec airflow webserver"
    ports:
      - "8085:8080"
    restart: always
    depends_on:
      - postgres

  airflow-scheduler:
    <<: *airflow-common
    container_name: nmm_airflow_scheduler
    command: bash -c "airflow db upgrade && exec airflow scheduler"
    restart: always
    depends_on:
      - postgres

volumes:
  nmm_postgres_data:
  nmm_airflow_home:
