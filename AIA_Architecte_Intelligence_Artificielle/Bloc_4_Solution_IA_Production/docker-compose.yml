name: NMM-Lakers-Edition

x-airflow-common: &airflow-common
  build: .
  environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    - AIRFLOW__WEBSERVER__RBAC=True
    - AIRFLOW__WEBSERVER__AUTHENTICATE=True
    - AIRFLOW__API__AUTH_BACKEND=airflow.api.auth.backend.basic_auth
    - DATABASE_URL=${DATABASE_URL}
  volumes:
    - nmm_airflow_home:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs

services:

  postgres:
    image: postgres:13
    container_name: nmm_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - nmm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: nmm_airflow_init
    command: >
      bash -c "airflow db init && airflow users create --username admin --firstname Loic --lastname Valentini --role Admin --email loic@example.com --password admin"
    depends_on:
      - postgres

  airflow-webserver:
    <<: *airflow-common
    container_name: nmm_airflow_webserver
    command: bash -c "airflow db upgrade && exec airflow webserver"
    ports:
      - "8085:8080"
    depends_on:
      - postgres
      - airflow-init
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: nmm_airflow_scheduler
    command: bash -c "airflow db upgrade && exec airflow scheduler"
    depends_on:
      - postgres
      - airflow-init
    restart: always

volumes:
  nmm_postgres_data:
  nmm_airflow_home:
