version: "3.9"

services:

  ###############################################
  # POSTGRES – BLOC 3
  ###############################################
  bloc3_postgres:
    image: postgres:13
    container_name: bloc3_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5444:5432"
    volumes:
      - bloc3_postgres_data:/var/lib/postgresql/data
    networks:
      - bloc3_network

  ###############################################
  # AIRFLOW INIT – BLOC 3
  ###############################################
  bloc3_airflow_init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: bloc3_airflow_init
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@bloc3_postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__LOAD_EXAMPLES: "False"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - bloc3_airflow_logs:/opt/airflow/logs
      - bloc3_airflow_plugins:/opt/airflow/plugins
      - ./airflow/scripts:/opt/airflow/scripts

    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Loic \
          --lastname Valentini \
          --role Admin \
          --email valentini.loic@gmail.com

    depends_on:
      - bloc3_postgres
    networks:
      - bloc3_network
    restart: "no"

  ###############################################
  # AIRFLOW WEBSERVER – BLOC 3
  ###############################################
  bloc3_webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: bloc3_webserver
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@bloc3_postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__LOAD_EXAMPLES: "False"

    command: ["airflow", "webserver"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - bloc3_airflow_logs:/opt/airflow/logs
      - bloc3_airflow_plugins:/opt/airflow/plugins
      - ./airflow/scripts:/opt/airflow/scripts

    ports:
      - "8086:8080"

    depends_on:
      - bloc3_postgres
    networks:
      - bloc3_network
    restart: always

  ###############################################
  # AIRFLOW SCHEDULER – BLOC 3
  ###############################################
  bloc3_scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: bloc3_scheduler
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@bloc3_postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__LOAD_EXAMPLES: "False"

    command: ["airflow", "scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - bloc3_airflow_logs:/opt/airflow/logs
      - bloc3_airflow_plugins:/opt/airflow/plugins
      - ./airflow/scripts:/opt/airflow/scripts

    depends_on:
      - bloc3_postgres

    networks:
      - bloc3_network
    restart: always

################################################
# VOLUMES SPÉCIFIQUES AU BLOC 3
################################################
volumes:
  bloc3_postgres_data:
  bloc3_airflow_logs:
  bloc3_airflow_plugins:

################################################
# NETWORK ISOLE
################################################
networks:
  bloc3_network:
    driver: bridge
